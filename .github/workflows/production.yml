name: Production Deploy

on:
  workflow_dispatch:

env:
  HUSKY: 0

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      # Reporting only — never gates this deploy. ADR-0012's release lane: the full-tree
      # audit runs against the installed tree above and surfaces un-waived findings as the
      # deploy-anchored enforcement checkpoint for the monitoring lane's disposition clock
      # (critical before the next deploy, high within two). Placed before the build/deploy
      # steps so the report is visible while the deploy is still observable, not buried
      # after the fact.
      - name: Dependency risk report
        run: |
          set +e
          REPORT_PATH="/tmp/dependency-audit-report.json"
          audit_exit=0
          node scripts/ci/audit-with-allowlist.mjs --report "$REPORT_PATH" || audit_exit=$?

          {
            echo "## Dependency risk report"
            echo ""
            if [ ! -s "$REPORT_PATH" ]; then
              echo "**Audit unavailable — treat as unknown risk.**"
              echo ""
              echo "The dependency audit script exited ${audit_exit} without producing a report — it crashed rather than completing a scan. This deploy is proceeding anyway, but the full-tree dependency risk for this release is unknown."
            else
              failure_kind="$(jq -r '.failure.kind // empty' "$REPORT_PATH")"
              if [ -n "$failure_kind" ]; then
                failure_detail="$(jq -r '.failure.detail // "no detail"' "$REPORT_PATH")"
                echo "**Audit unavailable — treat as unknown risk.**"
                echo ""
                echo "The scanner could not produce a usable result (${failure_kind}): ${failure_detail}. This deploy is proceeding anyway, but the full-tree dependency risk for this release is unknown."
              elif [ "$(jq -r '.ok' "$REPORT_PATH")" = "true" ]; then
                echo "No un-waived high/critical advisories in the full dependency tree. Clean to deploy."
              else
                blocking_count="$(jq '.blocking | length' "$REPORT_PATH")"
                waived_count="$(jq '.waived | length' "$REPORT_PATH")"
                stale_count="$(jq '.stale | length' "$REPORT_PATH")"
                expired_count="$(jq '.expired | length' "$REPORT_PATH")"
                malformed_count="$(jq '.malformedWaivers | length' "$REPORT_PATH")"
                echo "**${blocking_count} un-waived high/critical advisory(ies) outstanding in the full dependency tree.**"
                echo ""
                echo "| ID | Severity | Package | Title |"
                echo "|---|---|---|---|"
                # Advisory titles are upstream free text; a pipe or newline would corrupt the table.
                jq -r '.blocking[] | [.id, .severity, .name, .title] | map(tostring | gsub("[|]"; "&#124;") | gsub("\r|\n"; " ")) | "| \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) |"' "$REPORT_PATH"
                echo ""
                echo "Waived: ${waived_count} · Stale waivers: ${stale_count} · Expired waivers: ${expired_count} · Malformed waivers: ${malformed_count}"
                echo ""
                echo "Disposition policy: a critical finding must reach fixed or waived-with-rationale-and-expiry before this deploy proceeds as a deliberate exception; a high finding must reach disposition within two deploys. This deploy is proceeding regardless — review before treating it as routine."
              fi
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Install Vercel CLI
        run: npm install -g vercel@54.2.0

      - name: Pull Vercel env
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/ci/vercel-deploy-with-retry.sh production_url --prebuilt --prod

      - name: Comment PR with URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        with:
          script: |
            const url = process.env.PRODUCTION_URL || '';
            if (!url) {
              core.warning('production_url is empty — skipping PR comment');
              return;
            }
            // Scheme-only check: prod may resolve to a custom domain, not *.vercel.app.
            // The deploy script already rejects non-https output before it reaches here.
            if (!/^https:\/\//.test(url)) {
              core.setFailed(`Unexpected production URL: ${url}`);
              return;
            }
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 1,
            });
            const merged = prs.find(pr => pr.merge_commit_sha === context.sha);
            if (merged) {
              await github.rest.issues.createComment({
                issue_number: merged.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ Production deployed: ${url}`,
              });
            }

      - name: Slack notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Non-fatal: never let a Slack hiccup mask the deploy result.
        # jq builds the JSON so values are escaped regardless of content.
        run: |
          payload="$(jq -cn --arg text "❌ PRODUCTION deploy failed for ${COMMIT_SHA}. Run: ${RUN_URL}" '{text: $text}')"
          curl -sS -X POST -H 'Content-type: application/json' \
            --max-time 10 --retry 2 --retry-delay 2 \
            --data "$payload" "$SLACK_WEBHOOK_URL" || true
