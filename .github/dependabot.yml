version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Bake window before a version-update PR opens (measured from the release date).
    # Version updates only — security updates are never delayed by cooldown.
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Scoped deps are listed by literal name as well as by glob. The globs do
      # match; the problem was ranking. Dependabot scores group specificity, and a
      # wildcard scores 93-103 against 500 for a group declaring no `patterns` —
      # so the catch-alls silently claimed them (PR #265). An exact literal scores
      # 1000 and outranks both. See ADR-0010.
      # --- Version-locked families ---
      # No update-types filter, so a major would move the whole family atomically —
      # but family majors are HELD in `ignore` below (taken as scheduled migrations,
      # not bot PRs).
      react:
        # @types/react* track react's version, not their own cadence
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        # eslint-config-next tracks next's version, not eslint's
        patterns:
          - "next"
          - "eslint-config-next"
      vitest:
        # Core + coverage-v8 share vitest's version. @vitejs/plugin-react is
        # compatibility- not version-locked: a vitest major can require a matching
        # plugin major, so it rides along instead of arriving separately.
        # @vitest/eslint-plugin is on its own track and lives in the `eslint` group.
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
          - "@vitejs/plugin-react"
      date-fns:
        # date-fns-tz tracks date-fns' major
        patterns:
          - "date-fns"
          - "date-fns-tz"
      radix-ui:
        # Only the unified `radix-ui` meta-package is used; no scoped @radix-ui/* deps.
        patterns:
          - "radix-ui"
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
          - "@dnd-kit/core"
          - "@dnd-kit/sortable"
          - "@dnd-kit/utilities"
      supabase:
        # Runtime client stack — supabase-js + ssr move together for SSR auth.
        # The `supabase` CLI is intentionally NOT grouped here: it's a dev tool on
        # its own release track (github.com/supabase/cli), unrelated to the SDK's
        # versioning. It flows through dev-minor-patch; majors come as individual
        # reviewable PRs (we stay current on the CLI rather than holding majors).
        patterns:
          - "@supabase/*"
          - "@supabase/ssr"
          - "@supabase/supabase-js"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "@tailwindcss/postcss"
          - "tailwind-merge"
          - "tw-animate-css"
      # --- Category groups (batch minor/patch; majors surface as individual reviewable PRs) ---
      nodemailer:
        # Batch routine runtime + type-def maintenance that would otherwise split
        # across production and development groups. Their majors are independent.
        patterns:
          - "nodemailer"
          - "@types/nodemailer"
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - "@playwright/*"
          - "@playwright/test"
          - "@testing-library/*"
          - "@testing-library/dom"
          - "@testing-library/jest-dom"
          - "@testing-library/react"
          - "@testing-library/user-event"
        update-types:
          - minor
          - patch
      eslint:
        # @vitest/eslint-plugin is eslint tooling, independent of vitest core.
        # @eslint/* is forward-looking (e.g. @eslint/js under flat config).
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@vitest/eslint-plugin"
        update-types:
          - minor
          - patch
      types:
        patterns:
          - "@types/*"
          - "@types/node"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
          - "@types/nodemailer"
        update-types:
          - minor
          - patch
      # --- Catch-alls ---
      dev-minor-patch:
        # `patterns: ["*"]` is load-bearing. A group with no `patterns` scores 500
        # for specificity and outranks every wildcard pattern, so it steals their
        # dependencies; the universal wildcard scores 1, which is where a catch-all
        # belongs. Membership is unchanged — `*` matches everything, and
        # `dependency-type` still does the real filtering.
        patterns:
          - "*"
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        patterns:
          - "*"
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Held major upgrades — handle as scheduled migrations, not bot PRs.
      # Every entry stays scoped to semver-major so SECURITY updates still flow; a
      # bare `dependency-name` with no `update-types` would suppress those too.
      # Review in January and July.
      - dependency-name: next
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "@supabase/supabase-js"
        update-types:
          - version-update:semver-major
      - dependency-name: "@supabase/ssr"
        update-types:
          - version-update:semver-major
      - dependency-name: date-fns
        update-types:
          - version-update:semver-major
      - dependency-name: date-fns-tz
        update-types:
          - version-update:semver-major
      - dependency-name: radix-ui
        update-types:
          - version-update:semver-major
      - dependency-name: "@dnd-kit/*"
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/coverage-v8"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      - dependency-name: "@tailwindcss/*"
        update-types:
          - version-update:semver-major
      - dependency-name: tailwind-merge
        update-types:
          - version-update:semver-major
      - dependency-name: tw-animate-css
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
